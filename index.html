<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ychk</title>
<meta name="description" content="Apps by ychk, including Posolog, a medication tracker for Android.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230b7a6b'/%3E%3Cg transform='rotate(-45 20 20)' fill='%23fff'%3E%3Cpath d='M14 14h6v12h-6a6 6 0 0 1 0-12z'/%3E%3Cpath d='M20 14h6a6 6 0 0 1 0 12h-6z' fill-opacity='.55'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b2330;--muted:#5a6474;--accent:#0b7a6b;--on-accent:#fff;--border:#e1e5ea;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0e1217;--card:#161c23;--text:#e6e9ef;--muted:#9ba5b3;--accent:#4cc9b0;--on-accent:#0e1217;--border:#27303a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
h1{font-size:clamp(30px,7vw,44px);line-height:1.15;letter-spacing:-.02em;margin:56px 0 8px}
.lead{font-size:18px;color:var(--muted);margin:0 0 28px}
.app{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;color:var(--text);text-decoration:none}
.app:hover{border-color:var(--accent)}
.logo{width:52px;height:52px;flex:none}
.app h2{margin:0;font-size:20px}
.app p{margin:2px 0 0;color:var(--muted)}
footer{margin:64px 0 0;padding:20px 0 36px;border-top:1px solid var(--border);color:var(--muted);font-size:14px}
footer p{margin:0 0 6px}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<main>
<h1>ychk</h1>
<p class="lead">Simple apps that respect your privacy.</p>
<a class="app" href="posolog/">
<svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="var(--accent)"/><g transform="rotate(-45 20 20)" fill="var(--on-accent)"><path d="M14 14h6v12h-6a6 6 0 0 1 0-12z"/><path d="M20 14h6a6 6 0 0 1 0 12h-6z" fill-opacity=".55"/></g></svg>
<div><h2>Posolog</h2><p>Medication tracker for Android phones, tablets and Wear OS watches.</p></div>
</a>
</main>
<footer>
<p><a href="posolog/">Posolog</a> &middot; <a href="posolog/privacy/">Posolog privacy policy</a> &middot; <a href="https://github.com/ychk99/ychk99.github.io/issues">Contact</a></p>
<p>&copy; 2026 ychk</p>
</footer>
</div>
</body>
</html>
